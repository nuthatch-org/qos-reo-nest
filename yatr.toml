# yatr - https://github.com/cargopete/yatr
#
# Task names are the same across every nuthatch-org repo, so `yatr ci` means
# the same thing wherever you are. Note that `ci` is deliberately not called
# `check`: `yatr check` is a builtin that validates this file, and it shadows
# any task of that name without warning.

# A nest is config, not code: nuthatch.toml plus derived artifacts. These tasks
# need the `nuthatch` binary on PATH, from a build with `[[ipfs]] cid_json_path`
# (nuthatch-org/nuthatch#1367).

[settings]
cache = true

[tasks.gen]
desc = "Regenerate schema.json / llms.txt / semantic.toml from nuthatch.toml"
run = ["nuthatch schema"]
sources = ["nuthatch.toml", "abis/**/*.json"]
no_cache = true

[tasks.drift]
desc = "Fail if the derived artifacts are stale against nuthatch.toml"
run = [
    "nuthatch schema",
    "git diff --exit-code -- schema.json llms.txt semantic.toml",
]
sources = ["nuthatch.toml", "abis/**/*.json", "schema.json", "semantic.toml"]

[tasks.doctor]
desc = "Probe the configured RPC endpoints for getLogs width and archive depth"
run = ["nuthatch doctor"]
no_cache = true

[tasks.dev]
desc = "Index and serve this nest locally, resolving documents through The Graph's IPFS gateway"
run = ["nuthatch dev --ipfs https://ipfs.thegraph.com/ipfs/"]
foreground = true
no_cache = true

[tasks.checks]
desc = "Run the nest's invariant and parity checks against indexed data"
run = ["nuthatch check"]
sources = ["checks/**/*.sql"]
no_cache = true

[tasks.links]
desc = "Fail if a relative markdown link points at a file that is not there"
shell = true
sources = ["**/*.md"]
run = ['''
missing=0
for f in $(git ls-files '*.md'); do
  d=$(dirname "$f")
  for l in $(grep -oE '\]\([^)]+\)' "$f" | sed 's/^](//;s/)$//' | grep -vE '^(https?:|mailto:|#|<)' | sed 's/#.*$//'); do
    [ -z "$l" ] && continue
    if [ ! -e "$d/$l" ]; then echo "broken: $f -> $l"; missing=$((missing+1)); fi
  done
done
if [ "$missing" -ne 0 ]; then echo "$missing broken relative link(s)"; exit 1; fi
echo "all relative markdown links resolve"
''']

[tasks.ci]
desc = "What CI can run without RPC access or indexed data: drift and links"
depends = ["drift", "links"]
run = []
